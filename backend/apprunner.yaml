version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install poetry
      - poetry config virtualenvs.create false
      - poetry install --only main --no-interaction --no-ansi
run:
  command: uvicorn main:app --host 0.0.0.0 --port 8080
  network:
    port: 8080
  env:
    - name: PORT
      value: "8080"
